name: Publish

on:
  push:
    branches:
      - build

# Queue runs instead of overlapping them: an older run finishing last would move `latest` back.
concurrency: publish

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: corepack enable
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes only the packages whose version is not on npm yet; the rest are skipped.
      # Lifecycle scripts would only rebuild what Build already built, with the token in env.
      - name: Publish
        run: pnpm -r publish --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
