name: Build, Lint, Format & Publish
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select validation scope
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" || "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'args=' >> "$GITHUB_OUTPUT"
          else
            echo 'args=--affected' >> "$GITHUB_OUTPUT"
          fi

      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # For some reason, in actions, run check can execute test before build
      - name: Run formating
        run: pnpm run format
        id: biome_format

      - name: Run linter
        run: pnpm run lint
        id: biome_lint

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-node24-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Building
        run: pnpm run build
        id: build

      - name: Typechecking
        run: pnpm run typecheck ${{ steps.scope.outputs.args }}
        env:
          TURBO_SCM_BASE: origin/${{ github.event.repository.default_branch }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Testing
        run: pnpm run test ${{ steps.scope.outputs.args }}
        id: test
        env:
          SLIPHER_SCHEDULER_REDIS_URL: redis://127.0.0.1:6379
          TURBO_SCM_BASE: origin/${{ github.event.repository.default_branch }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Commit and Push changes
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: apply formatting"
            git push origin HEAD:${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

      - name: Publish in pkg.pr.new
        run: pnpx pkg-pr-new publish './packages/*'
        if: github.repository == 'tiramisulabs/extra'
